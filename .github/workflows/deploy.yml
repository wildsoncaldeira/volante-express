name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Substitua o caminho abaixo para a pasta onde o Volante está instalado na VPS
          # e o nome do processo no PM2 (ex: "volante" ou "volante-app")
          script: |
            cd /caminho/para/o/seu/projeto/volante-app
            git pull origin main
            npm install
            npm run build
            pm2 restart volante-app
            
      - name: Send Telegram Notification on Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *Deploy Concluído com Sucesso!*
            
            O Volante Express foi atualizado na VPS da Hostinger.
            📌 Commit: ${{ github.event.head_commit.message }}

      - name: Send Telegram Notification on Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *Erro no Deploy!*
            
            A atualização do Volante Express na VPS falhou.
            Verifique os logs no GitHub Actions para corrigir.
